<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelos — Auvalanche!</title>
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
              "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#6EC6FF, #BEE9FF); font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #info { position: fixed; left: 8px; bottom: 8px; font: 12px/1.3 monospace; color: #1B2A49; background: rgba(255,255,255,.6); padding: 6px 8px; border-radius: 8px; white-space: pre; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import * as M from '../src/render/models.js';

const params = new URLSearchParams(location.search);
const gameView = params.has('game');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fcf70, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-4, 10, 8);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x7ED957 }));
ground.position.set(0, -0.01, -6);
scene.add(ground);

const mat = M.makeUnitMaterial();
const spinners = [];
const lines = [];
const tri = (g) => g.attributes.position.count / 3;
function addGeo(name, geo, x, z, scale = 1, budget = 0) {
  const m = new THREE.Mesh(geo, mat);
  const pivot = new THREE.Group();
  pivot.position.set(x, 0, z);
  pivot.scale.setScalar(scale);
  pivot.add(m);
  scene.add(pivot);
  spinners.push(pivot);
  const t = tri(geo);
  lines.push(`${name}: ${t} tris` + (budget ? ` (max ${budget})${t > budget ? ' ESTOUROU' : ''}` : '') +
    ` attrs=${Object.keys(geo.attributes).join(',')}`);
  console.log('TRIS', name, t);
}
function addGroup(name, grp, x, z, scale = 1) {
  const pivot = new THREE.Group();
  pivot.position.set(x, 0, z);
  pivot.scale.setScalar(scale);
  pivot.add(grp);
  scene.add(pivot);
  spinners.push(pivot);
  let t = 0, meshes = 0;
  grp.traverse((o) => { if (o.isMesh) { t += tri(o.geometry); meshes++; } });
  lines.push(`${name}: ${t} tris, ${meshes} meshes`);
  console.log('TRIS', name, t);
}

const small = gameView ? 1 : 1.9;
const names = ['Caramelo', 'Pintadinho', 'Pretinho', 'Branquinho'];
for (let i = 0; i < 4; i++) addGeo('filhote ' + names[i], M.buildPuppyGeometry(i), -4.2 + i * 1.5, 3.5, small, 260);
addGeo('gato', M.buildCatGeometry(), 2.2, 3.5, small, 260);
addGeo('gatao', M.buildFatCatGeometry(), 4.6, 3.5, gameView ? 1 : 1.3, 320);

if (!gameView) {
  addGeo('dogao', M.buildSuperDogGeometry(), -7, -2, 1, 900);
  const cannon = M.buildCannon();
  addGroup('canhao', cannon, -2.2, -1.2, 1.3);
  const tower = M.buildTower();
  addGroup('torre', tower, 5.5, -3, 1);
  const gp = M.buildGatePosts(2.3, 2.2);
  const gm = new THREE.Mesh(gp, new THREE.MeshLambertMaterial({ vertexColors: true, color: 0x2D9BF0 }));
  const gpv = new THREE.Group(); gpv.position.set(-10.5, 0, 3.5); gpv.add(gm); scene.add(gpv);
  lines.push('postes: ' + tri(gp) + ' tris');
  const blob = M.buildBlobGeometry();
  lines.push('blob: ' + tri(blob) + ' tris attrs=' + Object.keys(blob.attributes).join(','));
  const scen = M.buildScenery();
  if (params.has('scenery')) scene.add(scen);
  lines.push('cenario: ' + scen.children.length + ' meshes, ' + scen.children.map((c) => tri(c.geometry)).join('+') + ' tris');
  // anima recuo/rodas do canhão
  window.__cannon = cannon;
}
document.getElementById('info').textContent = lines.join('\n');
window.__tris = lines;

const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
if (gameView) { cam.position.set(0, 5.5, 8.5); cam.lookAt(0, 0, 0); }
else { cam.position.set(0, 12, 22); cam.lookAt(0, 1.6, -0.5); }
if (params.has('cam')) { const c = params.get('cam').split(',').map(Number); cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]); }
window.__stopSpin = params.has('still');

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  for (const s of spinners) s.rotation.y = (gameView || window.__stopSpin) ? 0 : t * 0.5;
  if (window.__cannon) {
    const c = window.__cannon;
    c.userData.barrel.position.z = Math.max(0, Math.sin(t * 3)) * 0.15;
  }
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
